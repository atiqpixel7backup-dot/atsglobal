<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATS Global</title>
<meta name="description" content="ATS Global — Clothing & Electronics. Order easily on WhatsApp. / পোশাক ও ইলেকট্রনিক্স, WhatsApp-এ অর্ডার করুন।">
<meta name="theme-color" content="#102b77">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:rgb(29,78,216); --blue-d:rgb(16,43,119); --blue-rgb:29,78,216; --neon-rgb:56,189,248;
  --ink:#eaf1ff; --muted:#c3d1ee; --line:rgba(255,255,255,.14);
  --green:#22c55e; --red:#fb4f6e; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:#050b1f;color-scheme:dark}
body{font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.65;font-size:16px;min-height:100vh;-webkit-font-smoothing:antialiased;color-scheme:dark;background:radial-gradient(900px 600px at 8% -5%,rgba(var(--blue-rgb),.6),transparent 60%),radial-gradient(800px 600px at 100% 8%,rgba(var(--neon-rgb),.26),transparent 60%),radial-gradient(700px 500px at 50% 115%,rgba(139,92,246,.28),transparent 60%),#050b1f;background-attachment:fixed;background-color:#050b1f}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
option{background:#0b1433;color:#fff}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.adm-only{display:none!important}
body.admin .adm-only{display:inline-flex!important}

/* ===== 3D GLASS BOXES + NEON SHADOW ===== */
.card,.dcard,.step,.trust div,.faq details,.arow,.acard,.hero-art div,.cart-empty,.m-img,.ci .t{
  background:linear-gradient(145deg,rgba(40,66,150,.82),rgba(11,20,62,.92));
  border:1px solid rgba(255,255,255,.16);border-top-color:rgba(255,255,255,.34);border-left-color:rgba(255,255,255,.26);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -12px 22px -14px rgba(0,0,0,.55),0 16px 32px -16px rgba(0,0,0,.75),0 0 22px -6px rgba(var(--neon-rgb),.45);
}
.card,.dcard,.step,.faq details,.trust div{transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover,.dcard:hover,.faq details:hover,.trust div:hover{
  transform:translateY(-5px);border-color:rgba(var(--neon-rgb),.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -12px 22px -14px rgba(0,0,0,.55),0 22px 40px -16px rgba(0,0,0,.8),0 0 34px -2px rgba(var(--neon-rgb),.75)}

/* ===== 3D GLASS BUTTONS + NEON SHADOW ===== */
.btn,.chip,.icon-btn,.b-view,.b-add,.sizes button,.close,.qty button,.mini,.tabbtn{
  position:relative;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.06) 52%,rgba(255,255,255,.14));
  border:1px solid rgba(255,255,255,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 7px rgba(0,0,0,.3),0 4px 0 rgba(0,8,40,.7),0 9px 18px -4px rgba(var(--neon-rgb),.55),0 0 16px rgba(var(--neon-rgb),.28);
  transition:transform .14s,box-shadow .2s,filter .2s}
.btn:hover,.chip:hover,.icon-btn:hover,.b-view:hover,.b-add:hover,.sizes button:hover,.close:hover,.qty button:hover,.mini:hover,.tabbtn:hover{
  transform:translateY(-2px);filter:brightness(1.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 7px rgba(0,0,0,.3),0 6px 0 rgba(0,8,40,.7),0 12px 26px -2px rgba(var(--neon-rgb),.8),0 0 28px rgba(var(--neon-rgb),.5)}
.btn:active,.chip:active,.icon-btn:active,.b-view:active,.b-add:active,.sizes button:active,.close:active,.qty button:active,.mini:active,.tabbtn:active{
  transform:translateY(3px);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 1px 0 rgba(0,8,40,.7),0 0 12px rgba(var(--neon-rgb),.5)}
.btn-primary,.b-add,.chip.active,.sizes button.on,.tabbtn.on,.mini.on{
  background:linear-gradient(180deg,rgba(var(--neon-rgb),1),rgb(var(--blue-rgb)) 85%);border-color:rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 7px rgba(0,0,0,.25),0 4px 0 rgba(0,10,60,.95),0 10px 22px -3px rgba(var(--neon-rgb),.85),0 0 26px rgba(var(--neon-rgb),.6)}
.btn-wa{background:linear-gradient(180deg,#4ade80,#15803d)!important;border-color:rgba(255,255,255,.5)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 7px rgba(0,0,0,.25),0 4px 0 #064e24,0 10px 22px -3px rgba(34,197,94,.85),0 0 26px rgba(34,197,94,.6)!important}
.btn-ask{background:linear-gradient(180deg,rgba(74,222,128,.55),rgba(21,128,61,.55))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 #064e24,0 8px 18px -4px rgba(34,197,94,.7),0 0 18px rgba(34,197,94,.4)!important}
.mini.danger,.btn-danger{background:linear-gradient(180deg,rgba(251,79,110,.8),rgba(159,18,57,.85))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 #4c0519,0 8px 18px -4px rgba(251,79,110,.75),0 0 18px rgba(251,79,110,.45)!important}
button[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-weight:600}
.btn-white{background:linear-gradient(180deg,#fff,#cfe0ff)!important;color:#0b2a74!important;text-shadow:none}

/* ===== INPUTS ===== */
input:not([type=checkbox]):not([type=color]):not([type=file]),select,textarea{
  width:100%;border-radius:12px;padding:10px 12px;outline:none;color:#fff;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.2);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);transition:.2s}
input::placeholder,textarea::placeholder{color:#8aa0cc}
input:focus,select:focus,textarea:focus{border-color:rgb(var(--neon-rgb));box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 3px rgba(var(--neon-rgb),.28),0 0 20px rgba(var(--neon-rgb),.5)}
input[type=checkbox]{accent-color:rgb(var(--neon-rgb));width:18px;height:18px}
input[type=color]{width:64px;height:40px;border:0;background:none;cursor:pointer}
textarea{resize:vertical;min-height:64px}
.err{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(251,79,110,.3),0 0 18px rgba(251,79,110,.5)!important}

/* Top notice */
.demo-bar{background:rgba(0,0,0,.45);color:#c6d4f5;font-size:13px;text-align:center;padding:6px 12px;border-bottom:1px solid rgba(var(--neon-rgb),.3);box-shadow:0 0 18px rgba(var(--neon-rgb),.25)}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(6,12,34,.72);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px -14px rgba(var(--neon-rgb),.6)}
.nav{display:flex;align-items:center;gap:10px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#fff;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.logo-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,rgb(var(--neon-rgb)),rgb(var(--blue-rgb)));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 rgba(0,10,60,.9),0 0 22px rgba(var(--neon-rgb),.8)}
.menu{display:none;gap:20px;margin-left:20px;font-weight:500;color:#cbd8f7}
.menu a:hover{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{height:44px;border-radius:999px;padding:0 16px 0 44px!important}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px;color:#9fb3da}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
.icon-btn svg{width:22px;height:22px}
.badge-count{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 14px rgba(251,79,110,.9)}
.burger{display:grid}
.mobile-menu{display:none;border-top:1px solid var(--line);background:rgba(6,12,34,.95)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500}
@media(min-width:900px){.menu{display:flex}.burger{display:none}.mobile-menu{display:none!important}}
@media(max-width:600px){.logo .t{display:none}}

/* Hero */
.hero{background:linear-gradient(135deg,rgba(var(--blue-rgb),.5),rgba(var(--neon-rgb),.14));border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px -34px rgba(var(--neon-rgb),.8);position:relative;overflow:hidden}
.hero .container{display:grid;gap:28px;padding-top:44px;padding-bottom:56px;align-items:center}
.hero small{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);padding:4px 14px;border-radius:999px;font-size:14px;box-shadow:0 0 16px rgba(var(--neon-rgb),.45)}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.2;margin:14px 0 12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.hero p{font-size:17px;color:#d6e2ff;max-width:520px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}
.hero-art{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:420px}
.hero-art div{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:58px;animation:floaty 5s ease-in-out infinite;overflow:hidden}
.hero-art div img{width:100%;height:100%;object-fit:cover;display:block}
.hero .container.noart{grid-template-columns:1fr!important}
.hero-art div:nth-child(2){animation-delay:-1.2s}.hero-art div:nth-child(3){animation-delay:-2.4s}.hero-art div:nth-child(4){animation-delay:-3.6s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(min-width:900px){.hero .container{grid-template-columns:1.15fr .85fr;padding-top:72px;padding-bottom:84px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Trust */
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:-28px;position:relative;z-index:5}
.trust div{border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;font-size:14px;color:#cbd8f7}
.trust i{font-style:normal;font-size:26px;filter:drop-shadow(0 0 8px rgba(var(--neon-rgb),.9))}
.trust b{display:block;font-size:15px;color:#fff}
@media(min-width:760px){.trust{grid-template-columns:repeat(4,1fr)}}

/* Sections */
section{padding:50px 0 8px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(24px,4vw,32px);font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.sec-head p{color:#c3d1ee;font-size:15px}
.line{width:54px;height:4px;border-radius:4px;background:rgb(var(--neon-rgb));margin-top:6px;box-shadow:0 0 14px rgb(var(--neon-rgb))}
.sec-tools{display:flex;gap:8px;flex-wrap:wrap}
.sec-tools .chip{padding:7px 14px;font-size:14px}

/* Filters */
.filters{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 12px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 20px;border-radius:999px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.toolbar select{width:auto;height:42px}
.count{color:var(--muted);font-size:14px}

/* Grid + cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card.dim{opacity:.6}
.thumb{position:relative;aspect-ratio:1/1;cursor:pointer;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.15)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .thumb img{transform:scale(1.07)}
.fallback{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(46px,9vw,72px)}
.tag{position:absolute;top:10px;left:10px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:rgb(var(--blue-rgb));border:1px solid rgba(255,255,255,.5);box-shadow:0 0 14px rgba(var(--neon-rgb),.8)}
.tag.new{background:#0891b2}
.tag.sale{background:var(--red);left:auto;right:10px;box-shadow:0 0 14px rgba(251,79,110,.9)}
.tag.hid{top:40px;background:#475569}
.demo-chip{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.25)}
.soldmask{position:absolute;inset:0;background:rgba(5,11,31,.72);display:grid;place-items:center;font-weight:700;font-size:18px;text-shadow:0 0 14px rgba(251,79,110,.9);color:#fff}
.qedit{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:3}
.qedit .mini{width:34px;height:34px}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat-l{font-size:12px;color:rgb(var(--neon-rgb));font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.info h3{font-size:16px;line-height:1.35;font-weight:600;cursor:pointer;color:#fff}
.info p{font-size:14px;color:#cfdcf7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:6px}
.price b{font-size:19px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.price s{font-size:13px;color:var(--muted)}
.card-actions{display:flex;gap:10px;margin-top:10px}
.card-actions button{flex:1;height:40px;border-radius:12px;font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted);white-space:pre-line}
.empty b{display:block;font-size:48px}

/* Delivery */
.deliv{display:grid;gap:16px}
@media(min-width:760px){.deliv{grid-template-columns:repeat(3,1fr)}}
.dcard{border-radius:var(--r);padding:20px}
.dcard i{font-style:normal;font-size:32px;filter:drop-shadow(0 0 10px rgba(var(--neon-rgb),.9))}
.dcard h3{margin:8px 0 4px;color:#fff}
.dcard p{color:#d6e2ff;font-size:15.5px}
.how{display:grid;gap:14px;margin-top:18px}
@media(min-width:760px){.how{grid-template-columns:repeat(4,1fr)}}
.step{border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:flex-start;color:#d6e2ff}
.step span{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,rgb(var(--neon-rgb)),rgb(var(--blue-rgb)));color:#fff;display:grid;place-items:center;font-weight:700;border:1px solid rgba(255,255,255,.5);box-shadow:0 3px 0 rgba(0,10,60,.9),0 0 16px rgba(var(--neon-rgb),.8)}

/* FAQ */
.faq{max-width:780px;margin:0 auto;display:grid;gap:14px}
.faq details{border-radius:16px;padding:0 18px}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:12px;color:#fff}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;color:rgb(var(--neon-rgb));line-height:1;text-shadow:0 0 12px rgb(var(--neon-rgb))}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 0 18px;color:#dbe6ff;font-size:15.5px;line-height:1.75}

/* Footer */
footer{background:rgba(0,0,0,.45);border-top:1px solid rgba(var(--neon-rgb),.35);box-shadow:0 -10px 40px -20px rgba(var(--neon-rgb),.6);margin-top:56px;padding:40px 0 100px;color:#b6c6ea}
footer .cols{display:grid;gap:24px}
@media(min-width:760px){footer .cols{grid-template-columns:1.4fr 1fr 1fr}}
footer h4{color:#fff;margin-bottom:8px}
footer a{display:block;padding:2px 0;color:#9fb3da;cursor:pointer}
footer a:hover{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.copy{border-top:1px solid rgba(255,255,255,.1);margin-top:26px;padding-top:16px;font-size:13px;color:#7f93bd}

/* Floating */
.fab{position:fixed;right:16px;bottom:18px;z-index:40;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#4ade80,#15803d);display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #064e24,0 0 28px rgba(34,197,94,.9)}
.fab svg{width:30px;height:30px}
.apill{position:fixed;left:14px;bottom:18px;z-index:40;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(14px);box-shadow:0 0 26px rgba(var(--neon-rgb),.7);font-size:13px;font-weight:600}
.apill .mini{height:34px;padding:0 12px;border-radius:999px;font-size:13px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(2,6,20,.7);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.overlay.show{opacity:1;pointer-events:auto}
#sheetOv{z-index:105}
.modal,.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);max-height:92vh;overflow:auto;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;
  background:linear-gradient(150deg,rgba(26,40,92,.96),rgba(8,14,38,.97));border:1px solid rgba(255,255,255,.22);border-top-color:rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 80px -20px rgba(0,0,0,.9),0 0 50px -4px rgba(var(--neon-rgb),.6)}
.modal{z-index:90;width:min(900px,94vw)}
.sheet{z-index:110;width:min(760px,94vw);padding:22px}
.modal.show,.sheet.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-body{display:grid}
@media(min-width:760px){.modal-body{grid-template-columns:1fr 1fr}}
.m-img{aspect-ratio:1/1;position:relative;border-radius:0}
.m-img img{width:100%;height:100%;object-fit:cover}
.m-info{padding:24px;display:flex;flex-direction:column;gap:10px}
.m-info h2{font-size:24px;color:#fff;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.m-price{display:flex;gap:10px;align-items:baseline}
.m-price b{font-size:28px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.m-price s{color:var(--muted)}
.close{position:absolute;top:12px;right:12px;z-index:3;width:40px;height:40px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.opt label{font-size:14px;font-weight:600;display:block;margin-bottom:8px;color:#cbd8f7}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sizes button{min-width:48px;height:42px;border-radius:12px;font-weight:600;padding:0 14px}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:38px;height:38px;border-radius:12px;font-size:18px}
.qty span{min-width:30px;text-align:center;font-weight:700}
.feat-list{list-style:none;display:grid;gap:4px;font-size:14.5px;color:#cbd8f7}

const KEY="ats_store_v2";
function loadData(){
  let seed=null,local=null;
  try{const t=document.getElementById("seed-data").textContent.trim();if(t)seed=JSON.parse(t)}catch(e){}
  try{const t=localStorage.getItem(KEY);if(t)local=JSON.parse(t)}catch(e){}
  let d;
  if(seed&&local)d=(local.rev>=seed.rev)?local:seed;else d=local||seed||DEFAULT_DATA;
  d=clone(d);const D=clone(DEFAULT_DATA);
  d.site=Object.assign({},D.site,d.site||{});
  ["delivery","faq","categories","products"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=D[k]});
  d.adminHash=d.adminHash||"";d.rev=d.rev||0;
  return d;
}
let data=loadData();
function commit(){
  data.rev=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(data))}
  catch(e){toast(B("⚠️ ব্রাউজারের স্টোরেজ ভরে গেছে — ছোট ছবি ব্যবহার করুন বা ব্যাকআপ নিন","⚠️ Browser storage is full — use smaller images or take a backup"))}

}

function hex2rgb(h){h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);if(isNaN(n))throw 0;return[(n>>16)&255,(n>>8)&255,n&255]}
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,sat=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;sat=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,sat,l]}
function hsl2rgb(h,sat,l){h=((h%360)+360)%360;const k=n=>(n+h/30)%12,a=sat*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
function applyTheme(){
  let c;try{c=hex2rgb(data.site.color||"#1d4ed8")}catch(e){c=[29,78,216]}
  const [h]=rgb2hsl(c);const neon=hsl2rgb(h-25,.95,.62),dark=c.map(v=>Math.round(v*.55));
  const r=document.documentElement.style;
  r.setProperty("--blue-rgb",c.join(","));r.setProperty("--neon-rgb",neon.join(","));r.setProperty("--blue","rgb("+c+")");r.setProperty("--blue-d","rgb("+dark+")");
  const m=document.querySelector("meta[name=theme-color]");if(m)m.content="rgb("+dark+")";
}

/* ================= PRODUCT CARDS ================= */
function imgHTML(p){
  const fb=`<div class="fallback" style="background:linear-gradient(135deg,${esc(p.grad[0])},${esc(p.grad[1])})">${esc(p.emoji||"🛍️")}</div>`;
  if(!p.img)return fb;
  return `<img src="${esc(p.img)}" alt="${esc(tr(p.name))}" loading="lazy" onerror="this.outerHTML=decodeURIComponent('${encodeURIComponent(fb)}')">`;
}
function cardHTML(p){
  const off=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
  const tag=p.isNew?`<span class="tag new">${s("tnew")}</span>`:(p.featured?`<span class="tag">${s("tfeat")}</span>`:"");
  return `<article class="card ${p.visible===false?"dim":""}">
    <div class="thumb" data-act="view" data-id="${p.id}">
      ${imgHTML(p)}${tag}
      ${off?`<span class="tag sale">−${num(off)}%</span>`:""}
      ${p.visible===false?`<span class="tag hid">${s("hidden")}</span>`:""}
      ${p.demo?`<span class="demo-chip">${s("demo")}</span>`:""}
      ${p.soldOut?`<span class="soldmask">${s("sold")}</span>`:""}
      ${ADMIN?`<div class="qedit"><button class="mini" data-act="pedit" data-id="${p.id}" aria-label="Edit">✏️</button><button class="mini danger" data-act="pdel" data-id="${p.id}" aria-label="Delete">🗑</button></div>`:""}
    </div>
    <div class="info">
      <span class="cat-l">${esc(catName(p.cat))}</span>
      <h3 data-act="view" data-id="${p.id}">${esc(tr(p.name))}</h3>
      <p>${esc(tr(p.desc))}</p>
      <div class="price"><b>${money(p.price)}</b>${p.old>p.price?`<s>${money(p.old)}</s>`:""}</div>
      <div class="card-actions">
        <button class="b-view" data-act="view" data-id="${p.id}">${s("details")}</button>
        <button class="b-add" data-act="add" data-id="${p.id}" ${p.soldOut?"disabled":""}>${p.soldOut?s("soldout_btn"):s("add")}</button>
      </div>
    </div>
  </article>`;
}

function renderShop(){
  let list=visProducts().filter(p=>state.cat==="all"||p.cat===state.cat);
  const q=state.q.trim().toLowerCase();
  if(q)list=list.filter(p=>[p.name.bn,p.name.en,p.desc.bn,p.desc.en,catName(p.cat)].join(" ").toLowerCase().includes(q));
  if(state.sort==="low")list=[...list].sort((a,b)=>a.price-b.price);
  if(state.sort==="high")list=[...list].sort((a,b)=>b.price-a.price);
  $("#count").textContent=s("found",{n:num(list.length)});
  $("#gridAll").innerHTML=list.length?list.map(cardHTML).join(""):`<div class="empty"><b>🔍</b>${esc(s("none"))}</div>`;
  $$("#filters .chip").forEach(c=>c.classList.toggle("active",c.dataset.c===state.cat));
}

      <span class="cat-l">${esc(catName(p.cat))}</span>

      <div class="opt"><label>${s("qty")}</label><div class="qty"><button id="mMinus" aria-label="−">−</button><span id="mQty">${num(mState.qty)}</span><button id="mPlus" aria-label="+">+</button></div></div>
      <button class="btn btn-primary" id="mAdd" style="margin-top:6px" ${p.soldOut?"disabled":""}>${p.soldOut?s("soldout_btn"):s("add_cart")}</button>

/* ================= CART ================= */
function addToCart(id,size,qty){
  const p=data.products.find(x=>x.id===id);if(!p||p.soldOut)return;
  const key=id+"|"+(size||"");const ex=cart.find(i=>i.key===key);
  if(ex)ex.qty=Math.min(50,ex.qty+qty);else cart.push({key,id,size,qty});
  saveCart();updateBadge();toast(s("added"));
}
function quickAdd(id){
  const p=data.products.find(x=>x.id===id);if(!p)return;
  if((p.sizes||[]).length){openModal(id);toast(s("pick_size"));return}
  addToCart(id,null,1);
}
const cartLines=()=>cart.map(i=>({...i,p:data.products.find(x=>x.id===i.id)})).filter(i=>i.p&&!i.p.soldOut);
const subtotal=()=>cartLines().reduce((t,i)=>t+i.p.price*i.qty,0);
const delFee=()=>formData.area==="outside"?+data.site.deliveryOutside:+data.site.deliveryDhaka;
function updateBadge(){$("#cartCount").textContent=num(cartLines().reduce((t,i)=>t+i.qty,0))}
function renderCart(){
  const lines=cartLines();
  if(!lines.length){
    $("#dBody").innerHTML=`<div class="cart-empty"><b>🛒</b>${esc(s("cart_empty"))}</div>`;
    $("#dFoot").innerHTML=`<a href="#shop" class="btn btn-primary" style="width:100%" id="startShop">${s("start")}</a>`;
    $("#startShop").onclick=closeAll;return;
  }
  $("#dBody").innerHTML=lines.map(i=>`
    <div class="ci">
      <div class="t">${imgHTML(i.p)}</div>
      <div><h4>${esc(tr(i.p.name))}</h4><small>${i.size?s("size1")+": "+esc(i.size)+" • ":""}${money(i.p.price)}</small>
        <div class="qty"><button data-a="minus" data-k="${esc(i.key)}">−</button><span>${num(i.qty)}</span><button data-a="plus" data-k="${esc(i.key)}">+</button></div></div>
      <div><div class="pr">${money(i.p.price*i.qty)}</div><button class="rm" data-a="rm" data-k="${esc(i.key)}">${s("remove")}</button></div>
    </div>`).join("")+`
    <div class="form">
      <h3>${s("ship_info")}</h3>
      <input id="fName" placeholder="${esc(s("name_ph"))}" value="${esc(formData.name)}" autocomplete="name">
      <input id="fPhone" type="tel" inputmode="tel" placeholder="${esc(s("phone_ph"))}" value="${esc(formData.phone)}" autocomplete="tel">
      <select id="fArea">
        <option value="dhaka" ${formData.area==="dhaka"?"selected":""}>${esc(s("area_d",{c:money(data.site.deliveryDhaka)}))}</option>
        <option value="outside" ${formData.area==="outside"?"selected":""}>${esc(s("area_o",{c:money(data.site.deliveryOutside)}))}</option>
      </select>
      <textarea id="fAddr" placeholder="${esc(s("addr_ph"))}">${esc(formData.address)}</textarea>
      <textarea id="fNote" placeholder="${esc(s("note_ph"))}">${esc(formData.note)}</textarea>
    </div>`;
  renderFoot();
  ["fName","fPhone","fAddr","fNote"].forEach(id=>$("#"+id).addEventListener("input",syncForm));
  $("#fArea").addEventListener("change",()=>{syncForm();renderFoot()});
}
function syncForm(){formData={name:$("#fName").value,phone:$("#fPhone").value,area:$("#fArea").value,address:$("#fAddr").value,note:$("#fNote").value}}
function renderFoot(){
  const sub=subtotal(),del=delFee();
  $("#dFoot").innerHTML=`<div class="sum"><div><span>${s("sub")}</span><span>${money(sub)}</span></div><div><span>${s("dfee")}</span><span>${money(del)}</span></div><div class="tot"><span>${s("total")}</span><span>${money(sub+del)}</span></div></div>
    <button class="btn btn-wa" id="waBtn">${s("order_wa")}</button><p class="note">${s("pay_note")}</p>`;
  $("#waBtn").onclick=checkout;
}
$("#dBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const it=cart.find(i=>i.key===b.dataset.k);if(!it)return;
  if(b.dataset.a==="plus")it.qty=Math.min(50,it.qty+1);
  if(b.dataset.a==="minus")it.qty=Math.max(1,it.qty-1);
  if(b.dataset.a==="rm")cart=cart.filter(i=>i!==it);
  saveCart();updateBadge();if($("#fName"))syncForm();
  const y=$("#dBody").scrollTop;renderCart();$("#dBody").scrollTop=y;
});
const MSG={
  bn:{t:"নতুন অর্ডার",size:"সাইজ",sub:"পণ্যের মোট",del:"ডেলিভারি",d:"ঢাকার ভেতরে",o:"ঢাকার বাইরে",tot:"সর্বমোট",cod:"ক্যাশ অন ডেলিভারি",n:"নাম",p:"ফোন",a:"ঠিকানা",no:"নোট"},
  en:{t:"New Order",size:"Size",sub:"Subtotal",del:"Delivery",d:"Inside Dhaka",o:"Outside Dhaka",tot:"Total",cod:"Cash on delivery",n:"Name",p:"Phone",a:"Address",no:"Note"}
};
function checkout(){
  syncForm();const lines=cartLines();if(!lines.length)return;
  let ok=true;const mark=(id,bad)=>{$(id).classList.toggle("err",bad);if(bad)ok=false};
  const phone=formData.phone.replace(/[\s\-]/g,"");
  mark("#fName",formData.name.trim().length<2);
  mark("#fPhone",!/^(\+?88)?01[3-9]\d{8}$/.test(phone));
  mark("#fAddr",formData.address.trim().length<8);
  if(!ok){toast(s("err"));const e=$(".err");e&&e.scrollIntoView({block:"center",behavior:"smooth"});return}
  const lg=data.site.orderLang==="auto"?L:(data.site.orderLang||"bn"),m=MSG[lg],mn=v=>"৳"+nl(v,lg);
  const sub=subtotal(),del=delFee(),out=formData.area==="outside";
  const R=["🛒 *"+m.t+" — "+tl(data.site.name,lg)+"*",""];
  lines.forEach((i,k)=>{R.push(nl(k+1,lg)+". "+tl(i.p.name,lg)+(i.size?" ("+m.size+": "+i.size+")":""));R.push("   "+nl(i.qty,lg)+" × "+mn(i.p.price)+" = "+mn(i.p.price*i.qty))});
  R.push("",m.sub+": "+mn(sub),m.del+" ("+(out?m.o:m.d)+"): "+mn(del),"*"+m.tot+": "+mn(sub+del)+"* ("+m.cod+")","",
    "👤 "+m.n+": "+formData.name.trim(),"📞 "+m.p+": "+phone,"📍 "+m.a+": "+formData.address.trim());
  if(formData.note.trim())R.push("📝 "+m.no+": "+formData.note.trim());
  sendWA(R.join("\n"),{order:true});
}


/* ================= WHATSAPP SEND (auto notification + fallback) ================= */
let lastWA="";
const waNum=()=>String(data.site.whatsapp).replace(/\D/g,"");
const FRAMED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
/* Automatic delivery to the seller's own WhatsApp through the free CallMeBot service */
function cmbSend(text,st){
  st=st||data.site;
  const ph="+"+String(st.cmbPhone||st.whatsapp).replace(/\D/g,"");
  const u="https://api.callmebot.com/whatsapp.php?phone="+encodeURIComponent(ph)+"&text="+encodeURIComponent(text)+"&apikey="+encodeURIComponent(String(st.cmbKey||"").trim());
  return fetch(u,{mode:"no-cors",cache:"no-store"}).then(()=>true,()=>false);
}
async function sendWA(text,opt){
  lastWA=text;const num=waNum(),enc=encodeURIComponent(text);
  const url="https://wa.me/"+num+"?text="+enc;
  const app="whatsapp://send?phone="+num+"&text="+enc;
  const auto=!!(opt&&opt.order&&data.site.autoSend&&String(data.site.cmbKey||"").trim());
  let autoOk=false,w=null;
  if(auto){toast(B("⏳ অর্ডার পাঠানো হচ্ছে…","⏳ Sending your order…"));autoOk=await cmbSend(text)}
  else if(!FRAMED){try{w=window.open(url,"_blank","noopener,noreferrer")}catch(e){}}
  const links=`<div class="fg2">
        <a class="btn btn-wa" href="${esc(app)}" style="text-decoration:none;height:50px;font-size:15px">📱 ${B("WhatsApp অ্যাপে খুলুন","Open in WhatsApp app")}</a>
        <a class="btn btn-ask" href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;height:50px;font-size:15px">🌐 ${B("ব্রাউজারে খুলুন","Open in browser")}</a></div>`;
  if(autoOk){
    sheet(`<h3>✅ ${B("আপনার অর্ডার পাঠানো হয়েছে","Your order has been sent")}</h3>
      <div class="fg">
        <p style="color:#dbe6ff">${B("অর্ডার আমাদের কাছে পৌঁছে গেছে। কিছুক্ষণের মধ্যে আপনার ফোন নম্বরে যোগাযোগ করে নিশ্চিত করা হবে। ধন্যবাদ!","Your order has reached us. We will contact you on your phone number shortly to confirm. Thank you!")}</p>
        <button class="btn btn-primary" data-act="orderdone">${B("ঠিক আছে","Done")}</button>
        <p class="note">${B("চাইলে WhatsApp-এও আমাদের জানাতে পারেন:","You can also tell us on WhatsApp:")}</p>
        ${links}
      </div>`);
    return;
  }
  const lead=auto
    ?B("স্বয়ংক্রিয়ভাবে পাঠানো যায়নি। নিচের বাটন দিয়ে নিজে পাঠান।","Automatic sending failed. Please send it yourself using the buttons below.")

async function hashPw(p){
  const str="ats|"+p;
  try{if(typeof crypto!=="undefined"&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}}catch(e){}
  let h=5381;for(const c of str)h=((h<<5)+h+c.charCodeAt(0))|0;return"x"+(h>>>0).toString(16);
}

function fileToDataURL(file,max){
  return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)});
}

function saveCategory(){
  const bn=$("#cf_bn").value.trim(),en=$("#cf_en").value.trim(),e=$("#cf_e").value.trim();

  if(catEdit>=0){Object.assign(data.categories[catEdit],{bn:bn||en,en:en||bn,emoji:e})}

function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function publishHTML(){
  let src;
  try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(!r.ok)throw 0;src=await r.text()}
  catch(e){toast(B("⚠️ এখান থেকে ফাইল বানানো যাচ্ছে না — সাইট লাইভ হওয়ার পর চেষ্টা করুন, অথবা ব্যাকআপ এক্সপোর্ট করুন","⚠️ Can't build the file here — try on the live site, or export a backup instead"));return}
  const re=/(<script id="seed-data" type="application\/json">)[\s\S]*?(<\/script>)/;
  if(!re.test(src)){toast(B("⚠️ ফাইলের কাঠামো মেলেনি","⚠️ Unexpected file structure"));return}
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  download("index.html",src.replace(re,(m,a,b)=>a+json+b),"text/html");
  toast(B("✅ ডাউনলোড হয়েছে — এটি Netlify Drop-এ আপলোড করুন","✅ Downloaded — upload it to Netlify Drop"));
}
$("#importFile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!d.site)throw 0;
      const keep=data.adminHash;data=d;data.adminHash=keep;const D=clone(DEFAULT_DATA);data.site=Object.assign({},D.site,data.site);
      ["delivery","faq","categories"].forEach(k=>{if(!Array.isArray(data[k]))data[k]=D[k]});
      commit();toast(B("✅ ব্যাকআপ ইমপোর্ট হয়েছে","✅ Backup imported"))}
    catch(err){toast(B("⚠️ ফাইলটি সঠিক ব্যাকআপ নয়","⚠️ Not a valid backup file"))}};
  r.readAsText(f);
});

/* ================= ADMIN ACTIONS (click delegation) ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=+el.dataset.id,i=+el.dataset.i;
  if(el.tagName==="A")e.preventDefault();
  const P=()=>data.products.findIndex(x=>x.id===id);
  switch(a){
    case "view":openModal(id);break;
    case "add":quickAdd(id);break;
    case "cat":state.cat=el.dataset.c;renderShop();break;
    case "openlogin":openLogin();break;
    case "openpanel":openPanel("products");break;
    case "gotab":openPanel(el.dataset.tab);break;
    case "logout":logout();break;
    case "loginsubmit":doLogin();break;
    case "sclose":sheetClose();break;case "wacopy":copyWA();break;case "orderdone":cart=[];saveCart();updateBadge();sheetClose();closeAll();break;case "cmbtest":testCMB();break;
    case "pclose":closePanel();break;
    case "langtog":$("#langBtn").click();break;
    case "tab":if(draft&&(pt==="content"||pt==="settings"))readDraft();pt=el.dataset.tab;draft=(pt==="content"||pt==="settings")?clone(data):null;renderPanel();break;
    /* products */
    case "pnew":if(!ADMIN)return;productForm(0);break;
    case "pedit":productForm(id);break;
    case "pdup":{const k=P();if(k<0)break;const c=clone(data.products[k]);c.id=Math.max(0,...data.products.map(x=>x.id))+1;c.name.bn=c.name.bn&&c.name.bn+" (কপি)";c.name.en=c.name.en&&c.name.en+" (copy)";data.products.splice(k+1,0,c);commit();toast(B("✅ কপি হয়েছে","✅ Duplicated"));break}
    case "pdel":{const k=P();if(k<0)break;if(confirm(B("এই পণ্যটি মুছবেন?","Delete this product?")+"\n"+tr(data.products[k].name))){data.products.splice(k,1);cart=cart.filter(c=>c.id!==id);saveCart();commit();toast(B("🗑 মুছে ফেলা হয়েছে","🗑 Deleted"))}break}
    case "ptog":{const k=P();if(k<0)break;const f=el.dataset.f;data.products[k][f]=!(f==="visible"?data.products[k][f]!==false:data.products[k][f]);commit();break}
    case "pup":{const k=P();moveItem(data.products,k,-1);commit();break}
    case "pdown":{const k=P();moveItem(data.products,k,1);commit();break}
    case "psave":saveProductForm();break;
    case "pupload":imgTarget={t:"product"};$("#imgFile").click();break;
    case "hupload":imgTarget={t:"hero",i};$("#imgFile").click();break;
    case "hclear":readDraft();if(draft.site.heroTiles[i])draft.site.heroTiles[i].img="";renderPanel();break;
    case "hdel":readDraft();draft.site.heroTiles.splice(i,1);renderPanel();break;
    case "hadd":readDraft();if((draft.site.heroTiles||[]).length>=6){toast(B("⚠️ সর্বোচ্চ ৬টি বক্স","⚠️ Maximum 6 boxes"));break}draft.site.heroTiles=draft.site.heroTiles||[];draft.site.heroTiles.push({emoji:"🛍️",img:""});renderPanel();break;
    case "pimgclear":formImg="";$("#pf_img").value="";{const base=editId?data.products.find(x=>x.id===editId):null;$("#pf_pv").innerHTML=imgHTML({name:{},emoji:$("#pf_emoji").value||"🛍️",grad:base?base.grad:PALETTE[0],img:""})}break;
    /* categories */
    case "cnew":categoryForm(-1);break;
    case "cedit":categoryForm(i);break;
    case "cdel":{const c=data.categories[i];if(data.products.some(p=>p.cat===c.id)){toast(B("⚠️ এই ক্যাটাগরিতে পণ্য আছে — আগে পণ্যগুলো সরান","⚠️ This category still has products — move them first"));break}
      if(confirm(B("ক্যাটাগরি মুছবেন?","Delete this category?"))){data.categories.splice(i,1);commit()}break}
    case "cup":moveItem(data.categories,i,-1);commit();break;
    case "cdown":moveItem(data.categories,i,1);commit();break;
    case "csave":saveCategory();break;
    /* content lists */
    case "savedraft":saveDraft();break;
    case "dadd":readDraft();draft.delivery.push({icon:"📦",title:{bn:"",en:""},text:{bn:"",en:""}});renderPanel();break;
    case "ddel":readDraft();draft.delivery.splice(i,1);renderPanel();break;
    case "fadd":readDraft();draft.faq.push({q:{bn:"",en:""},a:{bn:"",en:""}});renderPanel();break;
    case "fdel":readDraft();draft.faq.splice(i,1);renderPanel();break;
    case "fup":readDraft();moveItem(draft.faq,i,-1);renderPanel();break;
    case "fdown":readDraft();moveItem(draft.faq,i,1);renderPanel();break;
    /* settings & backup */
    case "changepw":changePw();break;
    case "publish":publishHTML();break;
    case "exportjson":download("ats-global-backup.json",JSON.stringify(data,null,2),"application/json");break;
    case "importjson":$("#importFile").click();break;
    case "reset":if(confirm(B("সব পণ্য ও কনটেন্ট ডেমো ডেটায় ফিরে যাবে। নিশ্চিত?","All products and content will return to the demo data. Sure?"))){const keep=data.adminHash;data=clone(DEFAULT_DATA);data.adminHash=keep;draft=null;commit();toast(B("♻️ রিসেট হয়েছে","♻️ Reset done"))}break;
  }
});

/* ================= START ================= */
renderPage();
if(location.hash==="#admin")openLogin();
window.addEventListener("hashchange",()=>{if(location.hash==="#admin")openLogin()});
</script>
